schema: eolab/item/v1
id: wwf-atto-monthly-carbon-fluxes-2023
kind: nonspatial
primary_asset: data
temporal:
  mode: interval
  start_datetime: '2023-01-01T00:00:00Z'
  end_datetime: '2023-12-31T23:59:59Z'
metadata:
  title: ATTO monthly carbon fluxes, 2023
  description: Monthly net ecosystem exchange (NEE), gross primary productivity (GPP) and ecosystem respiration
    (Reco) at ATTO. Contains the twelve months of 2023, selected from the deposited 2014-2023 table.
  license: CC0-1.0
  attribution: Botia et al. (2026), supporting datasets deposited in Edmond.
  doi: 10.17617/3.OU3KYA
  citation: Botia et al. (2026). Supporting datasets for Carbon cycle response to Amazon drought in 2023.
    Version 1.0. Edmond. https://doi.org/10.17617/3.OU3KYA
  categories:
  - Nature
  statuses:
  - Matched to sheet description
  study_ids:
  - paper-023
  study_time: Monthly flux totals for January through December 2023; Time is a month-end label.
  publications:
  - id: paper-023
    title: Reduced Vegetation Uptake During the Extreme 2023 Drought Turns the Amazon Into a Weak Carbon
      Source
    doi: 10.1029/2025AV001658
    url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025AV001658
    year: 2026
  annotations:
    row_ids:
    - row-053
    limitations:
    - Underlying half-hourly measurements and quality flags are not included.
    - The source table's finalLat/finalLon describe air-trajectory endpoints, not the tower location.
    processing: Selected 2023 and six columns; original values and numeric precision preserved.
assets:
  data:
    location: local
    path: atto-monthly-carbon-fluxes-2023.csv
    media_type: text/csv
    roles:
    - data
    metadata:
      annotations:
        columns:
        - name: Time
          type: date
          description: Month-end label for the monthly total.
        - name: Year
          type: integer
          description: Calendar year.
        - name: Month
          type: integer
          description: Calendar month, 1 through 12.
        - name: NEE_gCper_m2_month
          type: number
          unit: g C m-2 month-1
          description: Monthly net ecosystem exchange. Selected values satisfy NEE = Reco - GPP; negative
            values indicate net uptake.
        - name: GPP_gCper_m2_month
          type: number
          unit: g C m-2 month-1
          description: Monthly gross primary productivity from partitioned eddy-covariance fluxes.
        - name: Reco_gCper_m2_month
          type: number
          unit: g C m-2 month-1
          description: Monthly ecosystem respiration from partitioned eddy-covariance fluxes.
        rows: 12
  review_context:
    location: local
    path: review-context.json
    media_type: application/json
    roles:
    - metadata
    metadata:
      title: Full review evidence and source history
  source_repository:
    location: external
    href: https://doi.org/10.17617/3.OU3KYA
    media_type: text/html
    roles:
    - metadata
    metadata:
      title: Original dataset repository
  publication:
    location: external
    href: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025AV001658
    media_type: text/html
    roles:
    - metadata
    metadata:
      title: Research article
  original:
    location: local
    path: source/ATTO_monthly_eddyfluxes_deltaCO2_2014_2023_v202511.csv
    media_type: text/csv
    roles:
    - data
    metadata:
      title: Complete original 2014-2023 table
      annotations:
        rows: 119
        missing_months:
        - 2021-05
        additional_columns:
          unnamed_first_column: Original row index, 0 through 118.
          finalLat / finalLon: Mean ending latitude / longitude of STILT backward trajectories.
          deltaCO2_ppm: Monthly mean regional CO2 signal, parts per million.
