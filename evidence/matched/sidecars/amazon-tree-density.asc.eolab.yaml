id: wwf-amazon-tree-density
kind: nonspatial
primary_asset: data
temporal:
  mode: modified
metadata:
  title: Tree density across the original Amazon forest
  description: The study mapped how tree density and diversity vary across Amazonian forest types. It
    found the highest tree densities in northwestern Amazonia and lower densities in central-southern
    and eastern areas; its density model explained 43% of variation among inventory plots. This file is
    the interpolated 0.1-degree density baseline, in trees per hectare, from old-growth inventories of
    woody individuals at least 10 cm in diameter at breast height. It describes the original lowland forest
    extent and can provide ecological context for conservation planning. Estimates retain substantial
    unexplained variation and do not measure current forest loss or restoration success. Map display awaits
    CRS confirmation.
  license: CC-BY-4.0
  attribution: ter Steege et al. (2023)
  doi: 10.6084/m9.figshare.22786166.v2
  citation: ter Steege et al. (2023). Mapping density, diversity and species-richness of the Amazon tree
    flora. Version2. Figshare. https://doi.org/10.6084/m9.figshare.22786166.v2
  categories:
  - Nature
  statuses:
  - CRS confirmation needed
  study_ids:
  - doi-10.1038-s42003-023-05514-6
  study_time: April 2023 ATDN compilation; the underlying plot census dates vary and do not establish
    one map observation interval.
  publications:
  - id: doi-10.1038-s42003-023-05514-6
    title: Mapping density, diversity and species-richness of the Amazon tree flora
    doi: 10.1038/s42003-023-05514-6
    url: https://www.nature.com/articles/s42003-023-05514-6
    year: 2023
  annotations:
    limitations:
    - Based on old-growth forest plots and interpolated over the original lowland forest extent; this
      is not a current forest-cover inventory.
    temporal_note: Catalog time is the source-file modification date, not a measurement date.
    processing: Original ASCII grid preserved byte for byte; no spatial reference or geometry assigned.
    evidence_type: Forest-inventory baseline with spatial interpolation
    dataset_role: Interpolated tree-density baseline, trees per hectare.
