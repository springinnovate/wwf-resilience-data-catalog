metadata:
  title: 'Eastern Amazon: biodiversity and carbon across land uses'
  description: At 310 eastern Amazon sites, logged-and-burned primary forest had 25% lower large-tree
    richness and 27% lower dung-beetle richness than undisturbed primary forest. Aboveground carbon was
    28–46% lower in logged or logged-and-burned forest. These observational comparisons show ecological
    differences within standing forests as well as across land uses. The table contains site-level richness
    for seven groups and four carbon pools; forest-species richness is linked separately. Use it to compare
    biodiversity and carbon among land-use classes. The paper's estimated transition impacts require further
    analyses; these data are not repeated measurements of sites before and after an intervention.
  license: Apache-2.0
  attribution: Nunes et al. (2022)
  doi: 10.5281/zenodo.6518744
  keywords:
  - eastern Amazon
  - land use
  - forest degradation
  - species richness
  - carbon stocks
  - secondary forest
  categories:
  - Nature
  - Nature's Contributions to People
  study_ids:
  - doi-10.1073-pnas.2202310119
  study_time: Field surveys during 2010 and 2011.
  publications:
  - id: doi-10.1073-pnas.2202310119
    title: Linking land-use and land-cover transitions to their ecological impact in the Amazon
    doi: 10.1073/pnas.2202310119
    url: https://www.pnas.org/doi/10.1073/pnas.2202310119
    year: 2022
  annotations:
    limitations:
    - Site tables remain nonspatial; coordinates require a verified join and CRS.
    - Missing values remain NA. Site aggregates do not replace individual observations.
    evidence_type: Observational comparison
    dataset_role: Site-level species richness and carbon pools across land-use classes.
