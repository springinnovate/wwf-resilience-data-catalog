metadata:
  title: 'Amazon fisheries: harvest trends and resilience'
  description: Amazon fish landings shifted toward smaller-bodied species across six regional time series,
    even though total landed biomass showed no consistent decline. The study combines these observations
    with food-web models in which species can temporarily replace declining catches, while continued depletion
    reduces that buffering capacity. The models suggest that higher biodiversity can delay fishery collapse;
    the landings alone do not demonstrate that outcome. This table provides 121 annual regional records
    from 1984–2016, including landings, diversity and biomass-weighted traits. It supports scrutiny of
    warning signs beyond total catch, but lacks fishing effort, subsistence harvests and independent stock
    surveys needed for a complete fishery assessment.
