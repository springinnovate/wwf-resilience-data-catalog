  categories:
  - Nature
  statuses:
  - Matched
  study_ids:
  - paper-023
  study_time: Monthly flux totals for January through December 2023; Time is a month-end label.
  publications:
  - id: paper-023
    title: Reduced Vegetation Uptake During the Extreme 2023 Drought Turns the Amazon Into a Weak Carbon
      Source
    doi: 10.1029/2025AV001658
    citation: null
    url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025AV001658
    authors: []
    year: 2026
    notes: []
