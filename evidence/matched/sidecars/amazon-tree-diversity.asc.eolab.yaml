metadata:
  title: Amazon tree alpha-diversity
  description: Estimated Fisher's alpha across Amazon lowland forests on the published 0.1-degree grid,
    interpolated from inventory plots by forest type. The original grid is available for download; map
    display awaits CRS confirmation.
  license: CC-BY-4.0
  attribution: ter Steege et al. (2023)
  doi: 10.6084/m9.figshare.22786166.v2
  citation: ter Steege et al. (2023). Mapping density, diversity and species-richness of the Amazon tree
    flora. Version2. Figshare. https://doi.org/10.6084/m9.figshare.22786166.v2
  categories:
  - Nature
  statuses:
  - Matched to sheet description
  - CRS confirmation needed
  study_ids:
  - paper-016
  study_time: April 2023 ATDN compilation; the underlying plot census dates vary and do not establish
    one map observation interval.
  publications:
  - id: paper-016
    title: Mapping density, diversity and species-richness of the Amazon tree flora
    doi: 10.1038/s42003-023-05514-6
    url: https://www.nature.com/articles/s42003-023-05514-6
    year: 2023
  annotations:
    row_ids:
    - row-039
    limitations:
    - Based on old-growth forest plots and interpolated over the original lowland forest extent; this
      is not a current forest-cover inventory.
    temporal_note: Catalog time is the source-file modification date, not a measurement date.
    processing: Original ASCII grid preserved byte for byte; no spatial reference or geometry assigned.
