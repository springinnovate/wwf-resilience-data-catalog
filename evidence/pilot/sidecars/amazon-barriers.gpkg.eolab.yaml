      locator: page3, Section2.2 Spatial Framework
      supports:
      - natural and anthropogenic barriers
      - author validation with imagery and official planning documents
    - source: paper-006_fish-access-climate-change.pdf
      locator: page11, Data Availability Statement
      supports:
      - article-to-dataset DOI association
    - source: outputs/matches.csv
      locator: row-012; related rows010–011
      supports:
      - 562 barrier records identified as supporting inputs
      - no supplied dCCI or mean impact ranking output
    - source: AnthropogenicBarriers_row34/AnthropogenicBarriers_row34/barriers_all_validas4326.shp
      locator: native layer/schema read and GeoPackage round-trip
      supports:
      - 562features
      - EPSG4326
      - 31attributes
      - 359dams/203waterfalls
      - 293current/269future
      - valid geometries and exact decoded-value preservation
    doi_scope: The dataset DOI identifies the original deposited package. This preparation has no separately
      registered DOI.
    processing:
    - Convert all 562 records from the supplied UTF-8 Shapefile to one GeoPackage layer.
    - Preserve native WGS84 (EPSG:4326) coordinates, record order, all 31 attributes, nulls, category
      spelling, current/future labels and per-record source references.
    - No reprojection, filtering, geometry repair, snapping, status harmonization, connectivity calculation
      or barrier ranking.
    - GeoPackage stores numeric values in native SQLite numeric types rather than Shapefile display widths/decimal
      declarations; decoded values must remain exactly equal.
    source_version: v1
    license_note: The Zenodo record lists Creative Commons Attribution 4.0 International for this deposited
      package. Retain original per-record Source attribution fields.
    temporal_note: Catalog time uses the preserved Shapefile modification time; source scenario labels
      are not observation dates.
