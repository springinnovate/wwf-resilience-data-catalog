name: Rebuild and validate matching tables
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_inputs.py
      - run: python scripts/build_reconciliation.py
      - run: python scripts/validate_reconciliation.py
      - run: python scripts/build_reconciliation.py --output-dir build/reconciliation-repeat
      - run: python scripts/validate_reconciliation.py --output-dir build/reconciliation-repeat
      - run: python scripts/compare_outputs.py build/reconciliation-repeat --expected build/reconciliation
      - run: python scripts/build_article_report.py
      - run: python scripts/build_article_report.py --output-dir build/articles-repeat
      - run: python scripts/compare_outputs.py build/articles-repeat --expected build/articles
      - run: python -m unittest discover -s tests -v

  evidence-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-evidence.txt
      - run: python -m unittest discover -s tests/evidence -v
