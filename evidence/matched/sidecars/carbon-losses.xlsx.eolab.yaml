    location: local
    path: carbon-losses.xlsx
    media_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    roles:
    - data
    metadata:
      annotations:
        sheet: Sheet1
        rows: 212
        key_fields:
          Study: Study label; retain alongside RefID.
          AbsoluteCLoss: Absolute carbon loss, Mg C per hectare.
          PercLossCompIntactFor: Loss relative to intact forest, percent.
          Cpool: Carbon pools included by the source study.
  review_context:
