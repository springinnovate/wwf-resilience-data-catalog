temporal:
  mode: modified
metadata:
  title: 'Amazon trees: animal seed dispersal and seed traits'
  description: Animal-mediated seed dispersal accounts for roughly four in five sampled Amazonian tree
    species under the study's two classification systems. This indicates potential dependence of regeneration
    on animals, although the study did not measure regeneration after animal loss or protection. The table
    contains dispersal assignments, seed-mass classes and fruit fleshiness for 5,201 species. Use it to
    compare traits and dispersal modes while keeping the two classifications separate. It is a selection
    from the broader pollination-and-dispersal dataset. Some species have multiple assignments, and seed-mass
    values are class codes rather than measurements in grams.
  license: CC-BY-4.0
  attribution: ter Steege et al. (2026)
  doi: 10.6084/m9.figshare.28417586.v2
  keywords:
  - Amazon
  - seed dispersal
  - animal dispersal
  - regeneration
  - seed traits
  - tree species
  categories:
  - Nature
  study_ids:
  - doi-10.1038-s42003-026-09896-1
  study_time: Species-trait compilation; individual observation dates are not supplied.
  publications:
  - id: doi-10.1038-s42003-026-09896-1
    title: Pollination and dispersal networks in the Amazonian tree flora
    doi: 10.1038/s42003-026-09896-1
    url: https://www.nature.com/articles/s42003-026-09896-1
    year: 2026
  annotations:
    limitations:
    - seedmass contains logarithmic class codes, not measured mass in grams; exact class boundaries are
      unresolved.
    - Some species have multiple dispersal assignments. The two classifications must not be combined as
      independent species counts.
    temporal_note: Catalog time is the source-file modification date; it is not an observation date.
    evidence_type: Trait compilation
    dataset_role: Species-level dispersal assignments, seed-mass classes and fruit traits.
