    title: Biodiversity underpins fisheries resilience to exploitation in the Amazon river basin
    doi: 10.1098/rspb.2022.0726
    url: https://royalsocietypublishing.org/doi/10.1098/rspb.2022.0726
    year: 2022
  annotations:
    limitations:
    - These are regional summary metrics. Raw annual taxon-landings records and region geometries are
      not supplied.
    evidence_type: Observational landings analysis interpreted with theoretical food-web models
    dataset_role: Annual regional summary metrics from the observed landings series; not model trajectories
      or stock assessments.
