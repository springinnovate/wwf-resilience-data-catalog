temporal:
  mode: modified
metadata:
  title: Forest water-cycle vulnerability to climate and forest loss
  description: The study asked how climate stress and forest loss affect tropical forest water and carbon
    cycling. It identified vulnerability toward lower evapotranspiration in areas of forest loss, including
    the southern and eastern Amazon, while other tropical areas showed signals toward higher evapotranspiration.
    This 0.1-degree map is the dimensionless diagnostic index for evapotranspiration, the water returned
    to the atmosphere by vegetation and evaporation. Negative values indicate vulnerability toward decreases;
    positive values toward increases, with near-zero values indicating relative stability. It provides
    context for assessing forest water-cycle pressures. It is not a measurement of water flux, a probability
    of forest collapse, or an estimate of restoration benefits.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: GLEAM source data span 1980-2018; the broader study covers 1982-2018. The exact map interval
    is not embedded.
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Diagnostic model using satellite and environmental observations
    dataset_role: 0.1-degree TFVI diagnostic grid for evapotranspiration.
