metadata:
  title: Amazon fisheries and the connected wetlands that support them
  description: Migratory fishes accounted for more than 80% of known maximum commercial catches in the
    Amazon. Regional catches of migratory characiform fishes were associated with flooded forest area,
    supporting the study's proposal to manage fisheries and connected wetlands across river basins and
    national borders. This layer summarizes historical maximum annual catches for 20 commercial fish taxa
    across 198 sub-basins and mainstem sections. Values sum city-level maxima from different years. Use
    them to examine historical catch geography and its relationship to connected habitats; they do not
    estimate current fish stocks or the effect of a protection policy.
  attribution: Venticinque, Goulding, Barthem and colleagues; Amazon Waters Expert Working Group, supported
    by SNAPP.
  doi: 10.5063/F1TB152P
  citation: Venticinque et al. SNAPP Western Amazon Fish Database. https://doi.org/10.5063/F1TB152P
  keywords:
  - Amazon
  - commercial fisheries
  - migratory fish
  - flooded forests
  - river connectivity
  - historical catches
  categories:
  - Nature
  statuses: []
  study_ids:
  - doi-10.1111-faf.12328
  study_time: Contributing catch observations span 1976-2013; coverage differs by city.
  publications:
  - id: doi-10.1111-faf.12328
    title: Ecosystem-based management of Amazon fisheries and wetlands
    doi: 10.1111/faf.12328
    url: https://onlinelibrary.wiley.com/doi/10.1111/faf.12328
    year: 2019
  annotations:
    limitations:
    - Historical maxima are not observations for a common year or estimates of current stocks.
    - Source area and length attributes are retained; they are not recalculated from repaired geometry.
    license_note: The source names CC-BY-4.0 but also says share alike; redistribution terms need clarification.
    processing: Converted to GeoPackage with polygon-validity repair; all 198 records and their attribute
      values retained.
    evidence_type: Historical catch records
    dataset_role: Historical maximum annual catches by sub-basin and mainstem section.
