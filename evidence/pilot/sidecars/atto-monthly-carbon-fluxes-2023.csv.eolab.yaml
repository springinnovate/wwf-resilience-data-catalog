  annotations:
    row_ids:
    - row-053
    product_role: described_product
    preparation_status: Prepared and checked for the EOLab pilot; scientific limitations remain.
    limitations:
    - Monthly derived flux totals only; underlying half-hourly observations and quality flags are absent
      from this file.
    - The pilot does not reproduce original filtering, gap-filling, or partitioning.
    - No geographic footprint is assigned to the table. finalLat/finalLon are trajectory endpoints and
      must not be interpreted as fixed tower coordinates.
    - Original source series lacks May 2021; the selected 2023 year is complete.
    - Supporting Information Text S5 was not separately reviewed in this pilot inspection.
    source_sheet_annotations:
    - row_id: row-053
      study_objective: Here, we evaluate the response of the Amazon carbon cycle to this extreme event
        across different spatial scales.
      study_location: the biogeographic Amazon
      dataset_description: The monthly totals of NEE, GPP and Reco at ATTO, obtained from filtered high-quality
        half-hourly turbulent eddy covariance CO2 fluxes measured at 81 m above ground level, with gap-filling
        and EC-NEE partitioning to Gross Primary Productivity (GPP) and Ecosystem Respiration (Reco)
      asset_or_risk: ASSET
      typology_category: Nature
      typology_dimension: Ecosystem function
      relationship_description: Strong negative correlations between spatial anomalies in GPP and VPD
        (r = -0.69, p < 0.001), a moderate but significant negative correlation between TER and temperature
        anomalies (r = -0.48, p < 0.001), and significant negative correlations of both GPP (r = -0.58,
        p < 0.001) and TER (r = -0.55, p < 0.001) with CWD.
      threshold_description: ''
      time: '2023'
      Notes: 'BCK: hmm maybe not - I thought it could be useful for validating/adjusting global climate
        data but if it''s only one site can we even use it for that'
      'Data readiness: 1 = ready to ingest; 2 = needs additional work to use; 3 = could be useful for other modeling': ''
    metadata_evidence:
    - source: Source CSV header and all 119 records
      supports: Column names, units embedded in flux names, month-end labels, twelve 2023 rows, missing
        2021-05, no explicit quality flag columns.
    - source: https://edmond.mpg.de/api/datasets/:persistentId/?persistentId=doi:10.17617/3.OU3KYA
      locator: latestVersion.license; latestVersion.files[dataFile.id=333872]; citation.dsDescription
      supports: CC0-1.0, version 1.0, exact file identity, STILT endpoint coordinate meanings.
    - source: paper-023_amazon-carbon-source-2023.pdf
      locator: Section 2.2, printed pages 4-5 (PDF pages 5-6)
      supports: ATTO eddy covariance measured at 81 m; filtered half-hourly fluxes used for NEE, gap-filling,
        and partitioning; full processing details referred to Supporting Information Text S5.
    - source: paper-023_amazon-carbon-source-2023.pdf
      locator: Data Availability Statement, printed page 17 (PDF page 18)
      supports: Monthly totals of NEE, GPP, Reco and monthly mean regional deltaCO2 are supplied by dataset
        DOI.
    doi_scope: The dataset DOI identifies the original deposited package. This preparation has no separately
      registered DOI.
    processing:
    - Select Year=2023.
    - Retain Time, Year, Month and the three monthly carbon-flux columns.
    - Preserve original numeric strings; no new flux calculation or spatial inference.
    pilot_corrections:
    - Existing matches.csv calls the date column TimeYearMonth, but the source header is Time with separate
      Year and Month columns.
    - Existing matching evidence labels finalLat/finalLon station coordinates; authoritative dataset description
      says mean STILT ending locations.
    source_version: '1.0'
    sources:
