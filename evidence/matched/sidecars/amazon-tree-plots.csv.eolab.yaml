kind: nonspatial
primary_asset: data
temporal:
  mode: modified
metadata:
  title: 'Amazon tree diversity: plot observations'
  description: Across 2,046 Amazon forest inventory plots, tree density, species richness and Fisher's
    alpha diversity varied among forest types and regions. The study used spatial models for different
    forest types to map these patterns. This table contains the plot observations, standardized richness
    measures and diversity metrics for free-standing woody stems at least 10 cm in diameter at breast
    height. Use it to examine the observations behind regional biodiversity comparisons and to distinguish
    differences in density, richness and diversity. These inventories do not measure change through time
    or current forest condition. Coordinates remain table attributes because their datum is unverified.
  license: CC-BY-4.0
  attribution: ter Steege et al. (2023)
  doi: 10.6084/m9.figshare.22786166.v2
  keywords:
  - Amazon
  - forest inventory
  - tree density
  - species richness
  - Fisher's alpha
  - old-growth forest
  categories:
  - Nature
  study_ids:
  - doi-10.1038-s42003-023-05514-6
  study_time: Plot establishment years 1934-2021; these do not establish the dates of the reported measurements.
  publications:
  - id: doi-10.1038-s42003-023-05514-6
    title: Mapping density, diversity and species-richness of the Amazon tree flora
    doi: 10.1038/s42003-023-05514-6
    url: https://www.nature.com/articles/s42003-023-05514-6
    year: 2023
  annotations:
    limitations:
    - Coordinate datum is not documented in the inspected sources; this delivery is a table without inferred
      map geometry.
    - The paper reports establishment through 2020, while three supplied records have year_est=2021.
    temporal_note: Catalog time is the source-file modification date; it is not an observation date.
    evidence_type: Forest inventory and spatial interpolation
    dataset_role: Plot-level tree density, richness, diversity and reference data.
