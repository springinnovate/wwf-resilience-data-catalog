      annotations:
        encoding: UTF-8
        key: species
        missing_value: NA
        key_fields:
          seedmass: Logarithmic seed-mass class code.
          Fleshy: '0: dry; 1: fleshy fruit or caruncle.'
          Unassisted_Stevenson_Correa: Unassisted dispersal in the Stevenson/Correa classification.
          Unassisted_McGlone: Unassisted dispersal in the McGlone classification.
        dispersal_values: 0/1 indicators; more than one assignment can occur.
