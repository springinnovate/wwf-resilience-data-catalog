metadata:
  title: 'Chaglla hydropower: irrigation and climate scenarios'
  description: In the upper Huallaga basin, modeled irrigation choices could reduce Chaglla's firm power
    more strongly than climate change alone, while protecting crop production. The coupled watershed and
    reservoir analysis found trade-offs among food production, hydropower and ecosystems. This table contains
    336 modeled mean- and firm-power summaries in MW for 16 land-management configurations under selected
    climate scenarios. Use it to examine the power estimates within those comparisons; crop, ecosystem
    and other results require the broader analysis. Original scenario codes are retained because their
    mapping to published scenarios and exact period bounds remain unresolved. The firm-power reliability
    criterion also needs confirmation. These are modeled outputs, not observed electricity generation.
  license: CC-BY-4.0
  attribution: Ding et al. (2024)
  doi: 10.5281/zenodo.8161594
  keywords:
  - Chaglla
  - upper Huallaga
  - hydropower
  - irrigation
  - land management
  - climate scenarios
  categories:
  - Nature's Contributions to People
  study_ids:
  - doi-10.1038-s43247-024-01738-4
  study_time: Historical and three future climatology groups; exact period bounds differ between the paper
    and supplied code.
  publications:
  - id: doi-10.1038-s43247-024-01738-4
    title: Sustainable land and irrigation management to limit loss of hydropower in the Andes-Amazon
      headwaters
    doi: 10.1038/s43247-024-01738-4
    url: https://www.nature.com/articles/s43247-024-01738-4
    year: 2024
  annotations:
    limitations:
    - Management and climatology codes retain the source labels; their complete mapping to paper scenario
      names and periods needs confirmation.
    - These are modeled summary power estimates, not a daily power series or measured generation.
    temporal_note: Catalog time is the source-file modification date; it is not an observation date.
    evidence_type: Watershed and reservoir model
    dataset_role: Modeled mean and firm power for selected management and climate combinations.
