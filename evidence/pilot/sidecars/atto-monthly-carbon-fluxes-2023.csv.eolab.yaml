        - name: GPP_gCper_m2_month
          type: number
          unit: g C m-2 month-1
          description: Monthly gross primary productivity from partitioned eddy-covariance fluxes.
        - name: Reco_gCper_m2_month
          type: number
          unit: g C m-2 month-1
          description: Monthly ecosystem respiration from partitioned eddy-covariance fluxes.
