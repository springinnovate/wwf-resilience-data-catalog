metadata:
  title: 'Amazon river barriers: supplied current and future locations'
  description: '562 supplied barrier locations used as inputs to the Amazon fish-connectivity study: 359
    dams and 203 waterfalls. The file includes 293 current and 269 future scenario records. It contains
    locations and source attributes, not the computed connectivity indices or barrier-impact rankings.'
  license: CC-BY-4.0
  attribution: Katia Yofukuji, Thomaz Fabrin, Bruno Henrique Mioto Stabile, Dayani Bailly
  doi: 10.5281/zenodo.18000863
  citation: Yofukuji, K., Fabrin, T., Mioto Stabile, B. H., and Bailly, D. (2025). River Connectivity
    Analysis Pipeline (v1). Zenodo. https://doi.org/10.5281/zenodo.18000863
  categories:
  - Nature
  - Drivers & Pressures
  statuses:
  - Supporting input
  study_ids:
  - paper-006
  study_time: Current and future barrier scenarios; feature-level observation and commissioning dates
    are not established. The deposited package is version v1, published 20 December 2025; this release
    date is not an observation date.
  publications:
  - id: paper-006
    title: Anthropogenic Barriers Limit Fish Access to Essential Habitats in the Amazon in the Face of
      Climate Change
    doi: 10.1111/gcb.70685
    citation: Yofukuji et al. (2026). Anthropogenic Barriers Limit Fish Access to Essential Habitats in
      the Amazon in the Face of Climate Change. Global Change Biology 32:e70685. https://doi.org/10.1111/gcb.70685
    url: https://onlinelibrary.wiley.com/doi/10.1111/gcb.70685
    authors: []
    year: 2026
    notes: []
    annotations: {}
  annotations:
    row_ids:
    - row-009
    - row-010
    - row-011
    - row-012
    product_role: supporting_input
    preparation_status: Prepared and checked for the EOLab pilot; scientific limitations remain.
    limitations:
    - These are supporting input locations, not the missing RCIsuit connectivity or dCCI/impact-ranking
      outputs.
    - Current and future are source scenario labels. Feature observation dates and commissioning dates
      are not established.
    - Several auxiliary field definitions and the relationships among the three dam-status columns remain
      unresolved.
    - One Country value is null. Source spelling, capitalization, status labels and nulls are retained.
    - The authors report checking barriers against imagery and planning documents; that verification was
      not repeated in this pilot.
    source_sheet_annotations:
    - row_id: row-009
      study_objective: The goal of our study was to evaluate the interplay of climate change and barrier-driven
        river fragmentation on frugivorous fisheries resources across the Amazon basin focused on the
        accessibility of suitable areas in the years to come.
      study_location: the entire Amazon basin, including regions from Bolivia, Brazil, Colombia, Ecuador,
        Guyana, and Peru
      dataset_description: 'Climatic-environmental suitability and presence-absence potential distribution
        of 52 frugivorous fish species of socioeconomic value, projected on the hydrographic network of
        the Amazon River basin for both the present and the future under two climatic scenarios (moderate:
        SSP2-4.5 and pessimistic: SSP5-8.5).'
      asset_or_risk: ASSET
      typology_category: Nature
      typology_dimension: Biodiversity
      relationship_description: The distribution of the species was modeled as a function of bioclimatic
        and hydrological variables (Table S4) covering the Amazon hydrographic network.
      threshold_description: ''
      time: 1970-2000; 2030-2100
      Notes: 'SR: Yes, spatial asset file for presence/absence of fish of socioeconomic value (current
        and projectec)'
      'Data readiness: 1 = ready to ingest; 2 = needs additional work to use; 3 = could be useful for other modeling': '1'
    - row_id: row-010
      study_objective: The goal of our study was to evaluate the interplay of climate change and barrier-driven
        river fragmentation on frugivorous fisheries resources across the Amazon basin focused on the
        accessibility of suitable areas in the years to come.
      study_location: the entire Amazon basin, including regions from Bolivia, Brazil, Colombia, Ecuador,
        Guyana, and Peru
      dataset_description: Reach Connectivity Index weighted by suitability (RCIsuit) for every river
        reach of the Amazon basin, integrating the accessibility of habitats and their climatic-environmental
        suitability, under the baseline, current barrier and future barrier setups for migratory, sedentary
        and combined fish groups.
      asset_or_risk: ASSET
      typology_category: Nature
      typology_dimension: Ecosystem structure
      relationship_description: The distribution of the species was modeled as a function of bioclimatic
        and hydrological variables (Table S4) covering the Amazon hydrographic network.
      threshold_description: ''
      time: 2024; 2090
      Notes: 'SR: Yes, spatial asset file with local data'
      'Data readiness: 1 = ready to ingest; 2 = needs additional work to use; 3 = could be useful for other modeling': '1'
    - row_id: row-011
      study_objective: The goal of our study was to evaluate the interplay of climate change and barrier-driven
        river fragmentation on frugivorous fisheries resources across the Amazon basin focused on the
        accessibility of suitable areas in the years to come.
      study_location: the entire Amazon basin, including regions from Bolivia, Brazil, Colombia, Ecuador,
        Guyana, and Peru
      dataset_description: Integrated index (RCIsuit) obtained by multiplying the RCI values by the mean
        suitability predicted for each fish group, reflecting both the accessibility of habitats (RCI)
        and their climatic-environmental suitability, for combined, migratory and sedentary fish groups
      asset_or_risk: ASSET
      typology_category: Nature
      typology_dimension: Ecosystem structure
      relationship_description: The distribution of the species was modeled as a function of bioclimatic
        and hydrological variables (Table S4) covering the Amazon hydrographic network.
      threshold_description: ''
      time: 2024; 2030, 2050, 2070, and 2090
      Notes: 'SR: Yes, spatial asset file with local data'
      'Data readiness: 1 = ready to ingest; 2 = needs additional work to use; 3 = could be useful for other modeling': '1'
    - row_id: row-012
      study_objective: We applied a novel framework that combined predictions of species distribution
        models with a river connectivity index to identify accessible and climatic-environmental suitable
        habitats for frugivorous and socioeconomically important fish in the Amazon basin. We also ranked
        dams based on their potential for river fragmentation and blocking access to climate refuge for
        fish species.
      study_location: the entire Amazon basin, including regions from Bolivia, Brazil, Colombia, Ecuador,
        Guyana, and Peru
      dataset_description: Mean ranking of reservoir impact for individual current and future barriers,
        considering their potential for hydrological fragmentation and blocking access to climate refuge
        areas for fish, obtained from the leave-one-out barrier prioritization simulation (dCCI) across
        climate scenarios and fish groups.
      asset_or_risk: RISK
      typology_category: Drivers & Pressures
      typology_dimension: Land/water/sea use/cover change
      relationship_description: The distribution of the species was modeled as a function of bioclimatic
        and hydrological variables (Table S4) covering the Amazon hydrographic network.
      threshold_description: ''
      time: 2024; 2090
      Notes: 'SR: Yes, spatial asset file with local data'
      'Data readiness: 1 = ready to ingest; 2 = needs additional work to use; 3 = could be useful for other modeling': '1'
