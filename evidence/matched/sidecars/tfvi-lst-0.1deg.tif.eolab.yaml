temporal:
  mode: modified
metadata:
  title: 'Tropical forest vulnerability: surface warming'
  description: A statistical analysis found widespread vulnerability toward surface warming in forests
    of the Americas, associated with climate warming, atmospheric drying and tree-cover loss. This 0.1-degree
    map shows the daytime land-surface temperature component of the Tropical Forest Vulnerability Index.
    Positive values indicate vulnerability toward warming, negative values toward cooling, and near-zero
    values relative stability. Compare the pattern with local forest and climate observations to investigate
    pressure on forest cooling. Values are dimensionless, not degrees Celsius or estimates of cooling
    from planting or restoring forest.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: MODIS Collection-6 daytime surface-temperature inputs; broader study period 1982-2018. The
    exact map interval is not embedded.
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Statistical model using satellite observations
    dataset_role: 0.1-degree vulnerability index for daytime land-surface temperature.
  keywords:
  - tropical forest
  - surface temperature
  - forest cooling
  - forest loss
  - climate stress
