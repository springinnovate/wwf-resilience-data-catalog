metadata:
  title: Barriers to terrestrial connectivity across the Amazon
  description: This terrestrial resistance grid combines weighted human pressures and natural barriers,
    including rivers and wetlands, as an input to an Amazon connectivity model. Higher values represent
    stronger assumed barriers to ecological movement and processes; supplied scores range from 1 to 34.
    The wider study examined dams, forest loss, fire, extraction and roads across terrestrial, wetland
    and river ecosystems, and found higher modeled connectivity inside Indigenous Territories and Protected
    Areas than outside. Use this grid to examine the resistance assumptions behind the terrestrial analysis.
    Final connectivity results and area comparisons are separate outputs, and the spatial comparison does
    not establish a causal effect of protection or restoration.
  license: CC-BY-4.0
  attribution: Ritter et al. (2025)
  doi: 10.6084/m9.figshare.28089815.v1
  citation: Ritter, C. D. (2025). Amazon Basin data and code to replicate analyses. Version 1. Figshare.
    https://doi.org/10.6084/m9.figshare.28089815.v1
  keywords:
  - Amazon
  - connectivity
  - habitat fragmentation
  - Indigenous Territories
  - protected areas
  - resistance
  categories:
  - Nature
  study_ids:
  - doi-10.1073-pnas.2418189122
  study_time: Input layers represent different dates, spanning 2001-2023; this is a composite resistance
    surface.
  publications:
  - id: doi-10.1073-pnas.2418189122
    title: Indigenous territories and protected areas are crucial for ecosystem connectivity in the Amazon
      basin
    doi: 10.1073/pnas.2418189122
    url: https://www.pnas.org/doi/10.1073/pnas.2418189122
    year: 2025
  annotations:
    limitations:
    - Relative resistance scores are not probabilities or measured movement rates.
    - The delivered grid starts at 1; values have not been shifted to the paper's conceptual zero-impact
      baseline.
    temporal_note: Catalog time is a source-file modification date; the component dates are described
      in the linked evidence.
    processing: Lossless COG conversion in native EPSG:5641; grid, values and mask preserved.
    evidence_type: Connectivity model
    dataset_role: Terrestrial resistance grid used to model connectivity.
