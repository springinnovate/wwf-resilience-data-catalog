metadata:
  title: Tropical forest biomass vulnerability to climate and land-use pressures
  description: Satellite observations show that tropical forests respond differently to climate and land-use
    pressures. The study found widespread vulnerability in the Americas and slower recovery of forest
    carbon cycling as stress increased. This map shows the biomass component of that assessment, helping
    identify regions for closer monitoring and conservation or restoration planning. Negative index values
    indicate vulnerability toward biomass loss, positive values toward higher biomass, and values near
    zero relative stability. It is a standardized diagnostic index based on observed relationships; it
    does not measure carbon stocks, predict a probability of collapse, or estimate the benefit of a restoration
    intervention.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  statuses: []
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: 'Above-ground biomass response observations: 2000-2018. Broader study and long-term stressor
    records: 1982-2018.'
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    citation: Saatchi, S., et al. (2021). Detecting vulnerability of humid tropical forests to multiple
      stressors. One Earth 4(7), 988-1003. https://doi.org/10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or biomass stocks.
    - Exact map observation dates are unresolved. Results describe correlations and assume stable model
      relationships over time.
    temporal_note: Catalog time is the source-file modification date. Documented scientific periods are
      listed under study time.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Satellite observations and statistical modeling
    dataset_role: Derived biomass vulnerability index
