metadata:
  title: Tropical forest productivity vulnerability (TFVI), 0.1-degree grid
  description: Pan-tropical vulnerability index for gross primary productivity. Negative values indicate
    vulnerability toward decreases and positive values toward increases; values near zero indicate relative
    stability.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  statuses:
  - Matched to sheet description
  study_ids:
  - paper-010
  study_time: GPP inputs span 1982-2018; the derived map has no embedded observation interval.
  publications:
  - id: paper-010
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    row_ids:
    - row-020
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
