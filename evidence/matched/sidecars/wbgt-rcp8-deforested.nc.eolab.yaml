metadata:
  title: 'In-shade heat stress: RCP8.5 (2071–2100), forest replaced by savanna'
  description: This model run gives in-shade heat stress under RCP8.5 climate (2071–2100) with complete
    replacement of Amazon forest by savanna. Compare scenario 85S with 85F to examine the forest-cover
    contrast under the same climate. Across the paired experiments, complete savannization increased heat
    stress, with larger increases under RCP8.5. The grid contains warmest-month average daily maximum
    wet-bulb globe temperature (WBGT), in degrees Celsius; it is a single scenario, not the difference
    between runs. Map display awaits coordinate-system confirmation.
