schema: eolab/item/v1
id: wwf-brazil-heat-stress-exposure
kind: nonspatial
primary_asset: data
temporal:
  mode: modified
metadata:
  title: 'Brazil: additional heat exposure under Amazon savannization'
  description: Replacing all Amazon rainforest with savanna increased modeled human heat exposure relative
    to retained forest under the same climate. In the late-century RCP8.5 experiment, more than 11 million
    additional people exceeded the extreme in-shade heat-stress threshold, including about 5.7 million
    in the high-vulnerability subset. The experiment holds population at 2019 levels. This table contains
    the 12 published Figure 3 estimates for historical and future climates, in-shade and outdoor exposure,
    and vulnerability groups. Use it to compare additional exposure under this extreme land-cover change.
    High-vulnerability values are included in the totals; the estimates do not forecast population growth
    or observed health outcomes.
  license: CC-BY-4.0
  attribution: Oliveira et al. (2021)
  doi: 10.6084/m9.figshare.15128679.v1
  keywords:
  - Brazil
  - Amazon
  - heat stress
  - savannization
  - population exposure
  - climate scenarios
  categories:
  - Climate
  study_ids:
  - doi-10.1038-s43247-021-00275-8
  study_time: 2019 population applied to historical and late-century climate scenarios; no population-growth
    projection.
  publications:
  - id: doi-10.1038-s43247-021-00275-8
    title: Deforestation and climate change are projected to increase heat stress risk in the Brazilian
      Amazon
    doi: 10.1038/s43247-021-00275-8
    url: https://www.nature.com/articles/s43247-021-00275-8
    year: 2021
  annotations:
    limitations:
    - Population is in millions. The high-vulnerability rows are part of the totals and must not be added
      to them.
    - These are additional-exposure scenario summaries, not a municipal impact map; the paper uses inconsistent
      start years for its climate periods.
    temporal_note: Catalog time is the source-file modification date; it is not an observation date.
    evidence_type: Climate model experiment
    dataset_role: Published additional heat-exposure estimates with municipal supporting data.
