metadata:
  title: 'Eastern Amazon: biodiversity and carbon across land uses'
  description: Land-use comparisons at 310 eastern Amazon sites show that ecological losses extend beyond
    complete forest clearance. Logged-and-burned primary forest had 25% lower large-tree richness and
    27% lower dung-beetle richness than undisturbed primary forest; aboveground carbon also differed substantially
    among forest conditions. These are observational comparisons used to estimate transition impacts,
    not repeated measurements of experimentally changed sites. The supplied table contains site-level
    richness for seven groups and four carbon pools, with forest-species richness linked separately. It
    supports examining which ecological components differ across land uses and why tracking forest area
    alone can miss degradation; it does not itself contain the paper’s estimated transition effects.
  license: Apache-2.0
  attribution: Nunes et al. (2022)
  doi: 10.5281/zenodo.6518744
  categories:
  - Nature
  - Nature's Contributions to People
  study_ids:
  - doi-10.1073-pnas.2202310119
  study_time: Field surveys during 2010 and 2011.
  publications:
  - id: doi-10.1073-pnas.2202310119
    title: Linking land-use and land-cover transitions to their ecological impact in the Amazon
    doi: 10.1073/pnas.2202310119
    url: https://www.pnas.org/doi/10.1073/pnas.2202310119
    year: 2022
  annotations:
    limitations:
    - Site tables remain nonspatial; coordinates require a verified join and CRS.
    - Missing values remain NA. Site aggregates do not replace individual observations.
    evidence_type: Observational site comparisons combined with land-cover transition analysis
    dataset_role: Site-level biodiversity and carbon inputs underlying comparisons among land-use classes.
