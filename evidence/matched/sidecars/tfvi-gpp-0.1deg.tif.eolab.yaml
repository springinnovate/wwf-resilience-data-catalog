metadata:
  title: Forest productivity vulnerability to climate and forest loss
  description: The study asked where climate stress and forest loss are weakening humid tropical forests.
    It found widespread vulnerability of forest productivity in the Amazon, with stronger signals along
    the arc of deforestation. This 0.1-degree map is the dimensionless diagnostic index for gross primary
    productivity. Negative values indicate vulnerability toward lower productivity; positive values toward
    higher productivity, and values near zero indicate relative stability. It can help identify places
    for closer assessment alongside land-use and climate evidence. The index describes vulnerability inferred
    from observed relationships; it does not measure carbon uptake, the probability of forest collapse,
    or the effect of a restoration intervention.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: GPP inputs span 1982-2018; the derived map has no embedded observation interval.
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Diagnostic model using satellite and environmental observations
    dataset_role: 0.1-degree TFVI diagnostic grid for gross primary productivity.
