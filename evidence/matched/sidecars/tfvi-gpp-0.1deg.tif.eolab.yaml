temporal:
  mode: modified
metadata:
  title: 'Tropical forest vulnerability: photosynthetic carbon uptake'
  description: A statistical analysis found widespread vulnerability toward lower gross primary productivity
    in the Amazon, with stronger signals along the arc of deforestation. This 0.1-degree map shows that
    component of the Tropical Forest Vulnerability Index. Gross primary productivity is carbon taken up
    through photosynthesis before respiration losses. Negative values indicate vulnerability toward decreases,
    positive values toward increases, and near-zero values relative stability. Compare these patterns
    with local forest and climate observations. The dimensionless index does not measure carbon uptake
    or estimate the effect of a restoration action.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: GPP inputs span 1982-2018; the derived map has no embedded observation interval.
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Statistical model using satellite observations
    dataset_role: 0.1-degree vulnerability index for gross primary productivity.
  keywords:
  - tropical forest
  - photosynthesis
  - gross primary productivity
  - forest loss
  - climate stress
