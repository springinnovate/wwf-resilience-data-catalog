id: wwf-amazon-tree-density
kind: nonspatial
primary_asset: data
temporal:
  mode: modified
metadata:
  title: 'Amazon tree density: old-growth forest baseline'
  description: Old-growth forest inventories show higher tree densities in northwestern Amazonia and lower
    densities in central-southern and eastern areas. This 0.1-degree grid estimates trees per hectare
    across the original lowland forest extent, for woody individuals at least 10 cm in diameter at breast
    height. It provides a baseline for comparing forest structure among regions and forest types. The
    model explained 43% of variation among plots; it does not map current forest cover or change through
    time. Map display awaits coordinate-system confirmation.
  license: CC-BY-4.0
  attribution: ter Steege et al. (2023)
  doi: 10.6084/m9.figshare.22786166.v2
  citation: ter Steege et al. (2023). Mapping density, diversity and species-richness of the Amazon tree
    flora. Version2. Figshare. https://doi.org/10.6084/m9.figshare.22786166.v2
  categories:
  - Nature
  statuses:
  - CRS confirmation needed
  study_ids:
  - doi-10.1038-s42003-023-05514-6
  study_time: April 2023 ATDN compilation; the underlying plot census dates vary and do not establish
    one map observation interval.
  publications:
  - id: doi-10.1038-s42003-023-05514-6
    title: Mapping density, diversity and species-richness of the Amazon tree flora
    doi: 10.1038/s42003-023-05514-6
    url: https://www.nature.com/articles/s42003-023-05514-6
    year: 2023
  annotations:
    limitations:
    - Based on old-growth forest plots and interpolated over the original lowland forest extent; this
      is not a current forest-cover inventory.
    temporal_note: Catalog time is the source-file modification date, not a measurement date.
    processing: Original ASCII grid preserved byte for byte; no spatial reference or geometry assigned.
    evidence_type: Forest inventory and spatial interpolation
    dataset_role: Estimated trees per hectare on a 0.1-degree grid.
  keywords:
  - Amazon
  - old-growth forest
  - forest inventory
  - tree density
  - ecological baseline
