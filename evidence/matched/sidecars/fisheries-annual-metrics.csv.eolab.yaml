metadata:
  title: 'Amazon fisheries: harvest trends and resilience'
  description: Across six Amazon fish-landing series, catches shifted toward smaller-bodied species while
    total landed biomass showed no consistent decline. The study's theoretical food-web models showed
    how catches of other species could initially compensate for declines, and how continued depletion
    reduced that capacity. Higher biodiversity delayed collapse in the models; the landing records alone
    do not demonstrate this effect. This table contains 121 annual regional records from 1984–2016, including
    landed biomass, diversity and biomass-weighted traits. Use it to compare changes in catch composition
    and body size with total catches. Fishing effort, subsistence harvests and independent stock surveys
    are absent.
  license: CC-BY-4.0
