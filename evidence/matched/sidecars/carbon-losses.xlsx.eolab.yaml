metadata:
  title: 'Tropical forest carbon: disturbance losses and recovery'
  description: Tropical forest degradation can remove substantial aboveground carbon even when forest
    remains. This synthesis of 146 studies compares losses after different disturbances and carbon stocks
    during recovery. After 20 years, recovering degraded forests averaged 75% of reference carbon stocks,
    versus 38% in secondary forests regrowing after clearance. The reference is prior standing or nearby
    undisturbed forest. This difference includes carbon retained after disturbance; it does not mean faster
    accumulation. The supplied loss and recovery workbooks contain the compiled study estimates and a
    reference crosswalk. They support comparisons for carbon accounting and recovery planning, with substantial
    variation among disturbance types, regions and studies; they are not predictions for a particular
    site.
  license: CC-BY-4.0
  attribution: Heinrich, Holcomb et al. (2026)
  doi: 10.5281/zenodo.19470704
  categories:
  - Nature's Contributions to People
  study_ids:
