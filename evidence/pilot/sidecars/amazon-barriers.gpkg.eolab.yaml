schema: eolab/item/v1
id: wwf-amazon-barrier-locations
kind: vector
primary_asset: data
temporal:
  mode: modified
metadata:
  title: Amazon dams and waterfalls used to assess fish access to suitable habitat
  description: 'Dams can block fish from reaching suitable habitat as the climate changes. A study combining
    fish-distribution models with river connectivity found that the Amazon–Solimões corridor retains extensive
    connected, suitable habitat, while planned hydropower expansion and climate change could reduce such
    areas. This layer provides the dam and waterfall locations used to examine those risks and supports
    inspection of barriers relevant to energy and river-conservation planning. It contains current barriers
    and additional future-scenario records. The points are study inputs: the modeled habitat-access results
    and dam-impact rankings are not included in this layer.'
  license: CC-BY-4.0
  attribution: Katia Yofukuji, Thomaz Fabrin, Bruno Henrique Mioto Stabile, Dayani Bailly
  doi: 10.5281/zenodo.18000863
  citation: Yofukuji, K., Fabrin, T., Mioto Stabile, B. H., and Bailly, D. (2025). River Connectivity
    Analysis Pipeline (v1). Zenodo. https://doi.org/10.5281/zenodo.18000863
  categories:
  - Nature
  - Drivers & Pressures
  statuses: []
  study_ids:
  - doi-10.1111-gcb.70685
  study_time: Current and future barrier scenarios; observation and commissioning dates unknown.
  publications:
  - id: doi-10.1111-gcb.70685
    title: Anthropogenic Barriers Limit Fish Access to Essential Habitats in the Amazon in the Face of
      Climate Change
    doi: 10.1111/gcb.70685
    citation: Yofukuji et al. (2026). Anthropogenic Barriers Limit Fish Access to Essential Habitats in
      the Amazon in the Face of Climate Change. Global Change Biology 32:e70685. https://doi.org/10.1111/gcb.70685
    url: https://onlinelibrary.wiley.com/doi/10.1111/gcb.70685
    year: 2026
  annotations:
    limitations:
    - Connectivity indices and barrier-impact rankings are absent.
    - Some auxiliary field definitions and relationships between dam-status columns are unresolved.
    temporal_note: Catalog time is the source-file modification date, not an observation or scenario date.
    processing: Converted Shapefile to GeoPackage; all coordinates and 31 attributes retained.
    attribution_note: Retain the per-record Source attribution when reusing the data.
    evidence_type: Species-distribution and river-connectivity modeling
    dataset_role: Barrier-location inputs to the study
