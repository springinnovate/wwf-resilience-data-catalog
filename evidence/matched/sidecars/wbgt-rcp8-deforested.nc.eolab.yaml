metadata:
  title: 'In-shade heat stress: RCP8.5 with complete Amazon savannization'
  description: The study used a climate model to ask how complete replacement of Amazon forest by savanna
    would change heat stress alongside global warming. Across paired simulations, savannization raised
    in-shade heat stress, with greater increases under RCP8.5. This file supplies the RCP8.5 climate (2071-2100)
    scenario with complete Amazon savannization. Values are degrees Celsius for average daily maximum
    in-shade wet-bulb globe temperature in the warmest month, on a South American model grid. It is one
    scenario, not a difference map, observed illness record, or policy-effect estimate. Download is available;
    map display awaits CRS confirmation.
