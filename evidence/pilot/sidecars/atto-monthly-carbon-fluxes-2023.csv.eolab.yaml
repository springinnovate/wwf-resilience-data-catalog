metadata:
  title: ATTO forest carbon exchange during the 2023 Amazon drought
  description: During the extreme 2023 drought, the local forest measured near the Amazon Tall Tower Observatory
    remained a net carbon sink over the year. Reduced ecosystem respiration contributed to that balance;
    the authors suggest sufficient soil moisture buffered the forest. Their wider regional analysis found
    a different carbon balance. This table contains monthly carbon uptake, respiration and net exchange
    for 2023. Use it to examine local drought responses and ecosystem model performance, with the linked
    2014–2023 table providing the historical comparison. The tower measurements describe a local forest
    footprint and cannot establish the carbon balance of the whole Amazon.
