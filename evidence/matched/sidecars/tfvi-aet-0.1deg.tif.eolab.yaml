metadata:
  title: 'Tropical forest vulnerability: evapotranspiration'
  description: A statistical analysis found vulnerability toward lower evapotranspiration in areas of
    tropical forest loss, including the southern and eastern Amazon. Other regions showed the opposite
    direction. This 0.1-degree map shows the evapotranspiration component of the Tropical Forest Vulnerability
    Index. Negative values indicate vulnerability toward decreases in water returned to the atmosphere
    by plants and evaporation; positive values indicate increases, and near-zero values relative stability.
    Use it to examine regional water-cycle pressures. Values are a dimensionless index, not measured water
    flux or predicted gains from forest restoration.
  license: CC-BY-4.0
  attribution: Saatchi et al. (2021)
  doi: 10.5281/zenodo.5115158
  citation: Saatchi et al. (2021). Supporting scripts for 'Detecting Vulnerability of Humid Tropical Forests
    to Multiple Stressors'. Zenodo. https://doi.org/10.5281/zenodo.5115158
  categories:
  - Nature
  study_ids:
  - doi-10.1016-j.oneear.2021.06.002
  study_time: GLEAM source data span 1980-2018; the broader study covers 1982-2018. The exact map interval
    is not embedded.
  publications:
  - id: doi-10.1016-j.oneear.2021.06.002
    title: Detecting vulnerability of humid tropical forests to multiple stressors
    doi: 10.1016/j.oneear.2021.06.002
    url: https://linkinghub.elsevier.com/retrieve/pii/S2590332221003444
    year: 2021
  annotations:
    limitations:
    - Standardized index; values are not probabilities, percentages or measurements of the response variable.
    - Results describe correlations and assume stable model relationships over time.
    temporal_note: Catalog time is the source-file modification date, not the observation period.
    processing: Lossless COG conversion; original grid, full-resolution values and mask preserved.
    evidence_type: Statistical model using satellite observations
    dataset_role: 0.1-degree vulnerability index for evapotranspiration.
  keywords:
  - tropical forest
  - evapotranspiration
  - water cycle
  - forest loss
  - climate stress
