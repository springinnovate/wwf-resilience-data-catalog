metadata:
  title: 'Tropical forest carbon: disturbance losses and recovery'
  description: Across 146 studies of tropical moist forests, recovering degraded forests averaged 75 ±
    23% of reference aboveground carbon stocks 20 years after the last disturbance, compared with 38 ±
    16% in secondary forests regrowing after clearance (mean ± one standard deviation). The reference
    is prior standing or nearby undisturbed forest. The higher stock in degraded forests includes carbon
    retained through disturbance; it does not mean faster accumulation. The loss and recovery workbooks
    contain compiled study estimates and a reference crosswalk. Use them to compare disturbance-related
    carbon losses and recovery for carbon accounting and planning, allowing for variation among disturbance
    histories, regions and studies. They do not predict recovery at a particular site.
  license: CC-BY-4.0
  attribution: Heinrich, Holcomb et al. (2026)
  doi: 10.5281/zenodo.19470704
  keywords:
  - tropical moist forest
  - forest degradation
  - secondary forest
  - aboveground carbon
  - carbon recovery
  - disturbance
  categories:
  - Nature's Contributions to People
  study_ids:
  - doi-10.1126-sciadv.adz1923
  study_time: Literature compilation through January 2026; publication years are not measurement dates.
  publications:
  - id: doi-10.1126-sciadv.adz1923
    title: A meta-analysis of carbon losses and gains from tropical moist forest degradation and regeneration
    doi: 10.1126/sciadv.adz1923
    url: https://www.science.org/doi/10.1126/sciadv.adz1923
    year: 2026
  annotations:
    limitations:
    - RefID 96 refers to two citations. Four in-preparation loss records have no cached RefID; citation
      joins need review.
    - Use the saved workbook values; formulas depend on external references and have not been recalculated.
    temporal_note: Catalog time is the source-file modification date; it is not an observation date.
    evidence_type: Meta-analysis
    dataset_role: Compiled estimates of disturbance-related carbon losses and subsequent stocks.
