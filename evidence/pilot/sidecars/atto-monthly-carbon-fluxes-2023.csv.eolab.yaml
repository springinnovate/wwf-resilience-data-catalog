metadata:
  title: ATTO monthly carbon fluxes, 2023
  description: Monthly net ecosystem exchange, gross primary productivity and ecosystem respiration at
    ATTO during 2023. This is a twelve-month subset of the deposited flux table, with six columns retained
    without changing their values.
  license: CC0-1.0
  attribution: Botia et al. (2026), supporting datasets deposited in Edmond.
  doi: 10.17617/3.OU3KYA
